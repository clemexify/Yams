<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dés runner | Mon Yams</title>
<link rel="stylesheet" href="shared/kit.css?v=2">
</head>
<body>
<script src="shared/pont.js?v=3"></script>
<script src="shared/kit.js?v=4"></script>
<script>
// Dés runner : un dé dévale la neige, vu de côté.
// Toucher l'écran le fait sauter, un second toucher en l'air fait un double saut. Il évite
// bonshommes de neige, piles de cadeaux et chouettes, et attrape les dés qui flottent :
// cinq font une main, comptée trois fois au barème de Mon Yams. La course accélère.
(()=>{
const K=Kit,C=K.C,t=K.t;
const W=400,H=560,SOL=430,PX=90,R=18,G=2300;
let S;

function demarrer(){
  S={y:SOL-R,vy:0,sauts:0,ang:0,face:6,v:290,dist:0,score:0,coeurs:3,inv:0,objets:[],prochain:420,main:[],
     meilleure:null,figures:0,annonce:null,montagnes:0,sapins:0,attrapes:0};
  majStats();
}
function majStats(){K.stat('score',Math.round(S.score));K.stat('coeurs','♥'.repeat(Math.max(0,S.coeurs))||'0');}

function sauter(){
  if(S.sauts>=2)return;
  S.vy=S.sauts?-650:-760;S.sauts++;K.son('saut');
  K.eclats(PX,S.y+R,[C.neige],6,90);
}
function bas(){sauter();}
function touche(k,b,e){if(b&&!(e&&e.repeat)&&(k===' '||k==='ArrowUp'))sauter();}

function generer(){
  const niv=Math.min(1,S.dist/60000),r=Math.random();
  const x=W+40;
  if(r<.34)S.objets.push({type:'bonhomme',x,w:30,h:52});
  else if(r<.58){const n=Math.random()<.4+niv*.3?2:1;S.objets.push({type:'cadeaux',x,w:34,h:n===2?60:32,n});}
  else if(r<.72&&S.dist>3000)S.objets.push({type:'chouette',x,y:Math.random()<.4?SOL-45:SOL-K.rnd(75,110),w:38,h:28,ph:K.rnd(0,6)});
  else{
    // une arche de dés à attraper, qu'il faut sauter pour atteindre
    // deux arches de faces différentes : basse (saut simple) et haute (double saut), il faut choisir
    const fb=K.ent(1,6);let fh=K.ent(1,6);while(fh===fb)fh=K.ent(1,6);
    for(let i=0;i<2;i++)S.objets.push({type:'de',x:x+i*42,y:SOL-95-Math.sin((i+.5)/2*Math.PI)*10,f:fb,arche:'b'});
    for(let i=0;i<2;i++)S.objets.push({type:'de',x:x+i*42,y:SOL-185-Math.sin((i+.5)/2*Math.PI)*10,f:fh,arche:'h'});
    S.prochain=K.rnd(240,380)*(1-niv*.4)+S.v*.25+100+S.v*.5;return;
  }
  S.prochain=K.rnd(240,380)*(1-niv*.4)+S.v*.25;
}

function choc(){
  if(S.inv>0)return;
  S.coeurs--;S.inv=1.6;K.son('aie');K.secoue(10);majStats();
  if(S.coeurs<=0){
    K.fin({score:S.score,titre:['Le dé a fini dans la neige','The die ended up in the snow'],details:[
      [K.nb(S.dist/10)+' m',['Distance','Distance']],[S.attrapes,['Dés attrapés','Dice caught']],
      [S.meilleure?`${S.meilleure.nom} ${S.meilleure.pts*3}`:'·',['Meilleure main','Best hand']],[S.figures,['Figures','Combos']]]});
  }
}
function attraper(o){
  S.attrapes++;S.main.push(o.f);S.score+=o.f*2;K.son('point');K.eclats(o.x,o.y,[C.de,C.y],10,150);
  if(S.main.length>=5){
    const m=K.main(S.main),pts=m.pts*3;S.score+=pts;if(m.id!=='rien')S.figures++;
    if(!S.meilleure||m.pts>S.meilleure.pts)S.meilleure=m;
    S.annonce={txt:m.nom,pts,t:0};K.son(m.id==='yams'?'yams':m.id==='rien'?'pop':'bonus');
    if(m.id==='yams')K.secoue(8);S.main=[];
  }
  majStats();
}

function maj(dt){
  if(S.annonce){S.annonce.t+=dt;if(S.annonce.t>1.3)S.annonce=null;}
  S.inv=Math.max(0,S.inv-dt);
  S.v=Math.min(720,290+S.dist*.006);
  const dx=S.v*dt;S.dist+=dx;S.score+=dx/30;S.montagnes+=dx*.15;S.sapins+=dx*.5;
  // saut
  S.vy+=G*dt;S.y+=S.vy*dt;
  if(S.y>=SOL-R){S.y=SOL-R;if(S.vy>300)K.bip(220,.05,'triangle',.05);S.vy=0;S.sauts=0;}
  // le dé roule : la face change à chaque quart de tour
  const a0=S.ang;S.ang+=dx/R;if(Math.floor(S.ang/(Math.PI/2))!==Math.floor(a0/(Math.PI/2)))S.face=S.face%6+1;
  // objets
  S.prochain-=dx;if(S.prochain<=0)generer();
  for(let i=S.objets.length-1;i>=0;i--){
    const o=S.objets[i];o.x-=dx;
    if(o.type==='chouette'){o.ph+=dt*8;o.x-=40*dt;}
    if(o.x<-60){S.objets.splice(i,1);continue;}
    if(o.type==='de'){if(K.dist(o.x,o.y,PX,S.y)<R+14){S.objets.splice(i,1);attraper(o);}continue;}
    if(o.touche)continue;
    const oy=o.type==='chouette'?o.y:SOL-o.h/2,ow=o.w/2-3,oh=o.h/2-3,m=o.type==='chouette'?R*.8:R*.6;
    if(Math.abs(o.x-PX)<ow+m&&Math.abs(oy-S.y)<oh+m){o.touche=true;choc();if(K.etat!=='jeu')return;}
  }
  majStats();
}

function bonhomme(c,x,s){
  c.fillStyle='#eef2fa';c.beginPath();c.arc(x,SOL-s*.3,s*.32,0,7);c.fill();c.beginPath();c.arc(x,SOL-s*.78,s*.22,0,7);c.fill();
  c.fillStyle='#1c1a24';c.beginPath();c.arc(x-s*.08,SOL-s*.82,s*.03,0,7);c.arc(x+s*.08,SOL-s*.82,s*.03,0,7);c.fill();
  c.fillStyle='#ff8a3a';c.beginPath();c.moveTo(x,SOL-s*.77);c.lineTo(x-s*.18,SOL-s*.74);c.lineTo(x,SOL-s*.71);c.fill();
  c.fillStyle='#1c1a24';c.fillRect(x-s*.18,SOL-s*1.02,s*.36,s*.06);c.fillRect(x-s*.12,SOL-s*1.14,s*.24,s*.13);
}
function cadeau(c,x,y,s,coul){
  c.fillStyle=coul;K.rr(c,x-s/2,y-s/2,s,s,4);c.fill();
  c.fillStyle=C.y;c.fillRect(x-3,y-s/2,6,s);c.fillRect(x-s/2,y-3,s,6);
}
// croissant de lune, découpé une fois pour toutes sur un petit canvas
let _lune=null;
function lune(){
  if(_lune)return _lune;_lune=document.createElement('canvas');_lune.width=_lune.height=48;
  const l=_lune.getContext('2d');l.fillStyle='rgba(245,200,66,.9)';l.beginPath();l.arc(22,22,21,0,7);l.fill();
  l.globalCompositeOperation='destination-out';l.beginPath();l.arc(32,16,19,0,7);l.fill();return _lune;
}
function dessiner(c,dt){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090a14');g.addColorStop(1,'#1a1d33');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  K.neige(c,W,SOL,dt,30);
  c.drawImage(lune(),298,48);
  const m=S?S.montagnes:0,sp=S?S.sapins:0;
  // montagnes au loin
  c.fillStyle='#161a2c';c.beginPath();c.moveTo(0,SOL);
  for(let x=-((m)%220);x<W+220;x+=110)c.lineTo(x,SOL-120-((Math.floor((x+m)/110)%2)?60:0));
  c.lineTo(W,SOL);c.fill();
  // sapins
  for(let x=-(sp%90);x<W+90;x+=90){const s=34+((Math.floor((x+sp)/90)*37)%3)*8;
    c.fillStyle='#123526';c.beginPath();c.moveTo(x,SOL-s*1.6);c.lineTo(x+s*.5,SOL-12);c.lineTo(x-s*.5,SOL-12);c.fill();}
  // sol
  c.fillStyle='#e6ecf6';c.fillRect(0,SOL,W,H-SOL);c.fillStyle='rgba(155,120,240,.18)';c.fillRect(0,SOL,W,3);
  if(!S){K.de(c,PX,SOL-R,R*2,6);return;}
  for(const o of S.objets){
    if(o.type==='bonhomme')bonhomme(c,o.x,o.h*1.05);
    else if(o.type==='cadeaux'){cadeau(c,o.x,SOL-16,32,C.r);if(o.n===2)cadeau(c,o.x+2,SOL-44,26,C.b);}
    else if(o.type==='chouette'){
      c.save();c.translate(o.x,o.y);c.scale(1.3,1.3);c.fillStyle='#c9c3b5';c.beginPath();c.ellipse(0,0,13,11,0,0,7);c.fill();
      const ai=Math.sin(o.ph)*8;c.beginPath();c.moveTo(-6,-2);c.lineTo(-22,-2-ai);c.lineTo(-8,6);c.moveTo(6,-2);c.lineTo(22,-2-ai);c.lineTo(8,6);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(-4,-3,4,0,7);c.arc(4,-3,4,0,7);c.fill();c.fillStyle='#1c1a24';c.beginPath();c.arc(-5,-3,1.8,0,7);c.arc(3,-3,1.8,0,7);c.fill();
      c.fillStyle='#ff9b4a';c.beginPath();c.moveTo(-9,1);c.lineTo(-14,3);c.lineTo(-9,4);c.fill();c.restore();}
    else if(o.type==='de')K.de(c,o.x,o.y,24,o.f,{eclat:'rgba(245,200,66,.75)'});
  }
  // le coureur
  const clign=S.inv>0&&Math.floor(S.inv*10)%2===0;
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(PX,SOL+2,R*Math.max(.4,1-(SOL-R-S.y)/300),4,0,0,7);c.fill();
  if(!clign)K.de(c,PX,S.y,R*2,S.face,{angle:S.ang%(Math.PI/2),fond:C.g,point:'#06140d',ombre:false});
  // main
  const sz=26,gp=6,x0=W/2-(5*sz+4*gp)/2+sz/2,y0=28;
  c.fillStyle='#111117';K.rr(c,x0-sz/2-10,y0-sz/2-7,5*sz+4*gp+20,sz+14,12);c.fill();
  for(let i=0;i<5;i++){const x=x0+i*(sz+gp);
    if(i<S.main.length)K.de(c,x,y0,sz,S.main[i],{ombre:false});
    else{c.strokeStyle='rgba(236,234,246,.15)';c.lineWidth=1.5;c.setLineDash([3,3]);K.rr(c,x-sz/2,y0-sz/2,sz,sz,5);c.stroke();c.setLineDash([]);}}
  c.font=K.police(13,700);c.textAlign='left';c.textBaseline='middle';c.fillStyle='#2a2f45';c.fillText(K.nb(S.dist/10)+' m',14,H-24);
  if(S.main.length>=2){const mm=K.main(S.main);if(mm.id!=='rien'){c.textAlign='center';c.fillStyle=C.g;c.font=K.police(12,700);c.fillText(mm.nom,W/2,58);}}
  if(S.dist<1500){c.textAlign='center';c.fillStyle='#4a4f66';c.font=K.police(13,600);c.fillText(t('Touche pour sauter, deux fois pour un double saut','Tap to jump, twice for a double jump'),W/2,H-56);}
  if(S.annonce){
    const a=S.annonce,k=Math.min(1,a.t*5);
    c.save();c.globalAlpha=k*(a.t>1?Math.max(0,1-(a.t-1)/.3):1);c.fillStyle='rgba(9,9,13,.8)';K.rr(c,W/2-100,80,200,60,14);c.fill();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle=a.txt==='Yams'?C.y:C.tx;c.font=K.police(20,800);c.fillText(a.txt,W/2,100);
    c.fillStyle=C.y;c.font=K.police(17,800);c.fillText('+'+a.pts,W/2,124);c.restore();
  }
}

K.jeu({id:'15-des-runner',case:15,W,H,
  titre:['Dés runner','Dice Runner'],
  accroche:['Un dé lancé à toute allure dans la neige.','A die racing through the snow.'],
  regles:[
    ['Touche l\'écran pour sauter, une seconde fois en l\'air pour un double saut.','Tap to jump, tap again in the air for a double jump.'],
    ['Évite les bonshommes de neige, les cadeaux et les chouettes : trois chocs et c\'est fini.','Dodge snowmen, gifts and owls: three bumps and it is over.'],
    ['Attrape les dés qui flottent : saut simple pour l\'arche basse, double saut pour la haute, à toi de choisir la face. Cinq dés font une main, qui vaut trois fois ses points du Yams.','Catch the floating dice: single jump for the low arch, double jump for the high one, your choice of face. Five dice make a hand, worth three times its Yams points.'],
    ['Plus tu cours loin, plus ça va vite.','The further you run, the faster it gets.']],
  bouton:['Courir','Run'],
  stats:[['score',['Score','Score'],0],['coeurs',['Cœurs','Hearts'],'♥♥♥']],
  demarrer,maj,dessiner,bas,touche,
});
window.__runner=()=>S;
})();
</script>
</body>
</html>
