name: Deploy to OVH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /en est servi par en.html : le serveur OVH associe une adresse sans extension au
      # fichier du même nom, comme pour /regles. La page est une copie exacte de l'accueil,
      # fabriquée ici pour ne pas avoir deux fichiers à tenir à jour ; app.js lit l'adresse.
      - name: Fabriquer la page anglaise
        run: cp index.html en.html

      # Calendrier de l'avent : /avent/7 est servi par avent/7.html, même mécanisme que
      # /regles et /en. Chaque page est une copie de l'accueil ; app.js et avent.js lisent
      # l'adresse. La balise <base> fait pointer les chemins relatifs (style.css, app.js…)
      # vers la racine. /avent (sans numéro) est servi par avent/index.html. Pages exclues
      # de l'indexation : ce sont des doublons de l'accueil.
      - name: Fabriquer les pages du calendrier de l'avent
        run: |
          mkdir -p avent
          sed -e 's#<head>#<head>\n<base href="/">\n<meta name="robots" content="noindex">#' index.html > avent/index.html
          for i in $(seq 1 24); do cp avent/index.html "avent/$i.html"; done
          grep -q '<base href="/">' avent/7.html

      - name: Upload to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: monyamk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            simulate.html
            og-image.html
            index_complet.html
            test-*.html
            culman_strategy.md
            blaise_strategy.md
            LICENSE
            CNAME
            modeles-de-grilles/**
            advent-games-ecartes/**
            bot-lab/**
            sql/**
