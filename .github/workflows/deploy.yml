name: Deploy to OVH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /en est servi par en.html : le serveur OVH associe une adresse sans extension au
      # fichier du même nom, comme pour /regles. La page est une copie exacte de l'accueil,
      # fabriquée ici pour ne pas avoir deux fichiers à tenir à jour ; app.js lit l'adresse.
      - name: Fabriquer la page anglaise
        run: cp index.html en.html

      - name: Upload to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: monyamk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            simulate.html
            og-image.html
            index_complet.html
            test-*.html
            culman_strategy.md
            blaise_strategy.md
            LICENSE
            CNAME
            modeles-de-grilles/**
