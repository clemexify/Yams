<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lancer du yéti | Mon Yams</title>
<link rel="stylesheet" href="shared/kit.css?v=2">
</head>
<body>
<script src="shared/pont.js?v=3"></script>
<script src="shared/kit.js?v=2"></script>
<script>
// Lancer du yéti, case 4 du calendrier de l'avent.
// Le yéti lance un dé dans la neige comme avec une fronde. Six cibles portent les faces
// 1 à 6 : plus une cible est loin, plus sa face est forte et plus elle est petite. Le dé
// prend la face de la cible où il s'arrête (au hasard s'il tombe dans la neige). Cinq
// lancers font une main, comptée au barème de Mon Yams. Quatre manches, avec du vent et,
// à partir de la 3e, des cibles qui bougent.
(()=>{
const K=Kit,C=K.C,t=K.t;
const W=400,H=660,LX=W/2,LY=532,HAUT=78,BAS=470,MANCHES=4,PAR_MANCHE=5;
const G=1500;
const COUL=[null,'#8b86a3','#4d9bf0','#36cfc0','#27c47e','#9b78f0','#f5c842'];
let S;

function nouvelleManche(){
  S.lancer=0;S.main=[];
  const k=1-.07*(S.manche-1);
  // Six positions sans chevauchement, puis la face suit la distance au yéti
  let pos=[];
  for(let essai=0;essai<400&&pos.length<6;essai++){
    const r=(42-pos.length*3)*k,x=K.rnd(40+r,W-40-r),y=K.rnd(HAUT+30,BAS-10);
    if(pos.every(p=>K.dist(x,y,p.x,p.y)>p.r+r+16))pos.push({x,y,r});
  }
  if(pos.length<6){S.manche--;return nouvelleManche();}
  pos.sort((a,b)=>K.dist(LX,LY,a.x,a.y)-K.dist(LX,LY,b.x,b.y));
  const rayons=[34,33,31,29,26,23].map(r=>r*k);
  S.cibles=pos.map((p,i)=>({x:p.x,y:p.y,r:rayons[i],f:i+1,
    vx:S.manche>=3?(Math.random()<.5?-1:1)*K.rnd(12,22)*(S.manche-1.5):0,flash:0}));
  nouveauVent();
}
function nouveauVent(){
  const m=[18,40,60,80][S.manche-1];
  S.vent=Math.round(K.rnd(-m,m));
}
function demarrer(){
  S={manche:1,lancer:0,main:[],score:0,de:null,visee:null,cibles:[],vent:0,
     yams:0,mille:0,meilleure:null,pause:0,bras:0,annonce:null,vol:[]};
  nouvelleManche();majStats();
}
function majStats(){
  K.stat('score',S.score);K.stat('manche',`${Math.min(S.manche,MANCHES)}/${MANCHES}`);
}

// ── Visée à la fronde : on tire vers le bas, le dé part vers le haut ──
function bas(x,y){if(S.de||S.pause>0)return;S.visee={x0:x,y0:y,x,y};}
function glisse(x,y){if(S.visee){S.visee.x=x;S.visee.y=y;}}
function visee(){
  const v=S.visee;if(!v)return null;
  let dx=v.x0-v.x,dy=v.y0-v.y;const l=Math.hypot(dx,dy);
  if(l<14||dy>-4)return null;
  let a=Math.atan2(dx,-dy);a=K.clamp(a,-1.05,1.05);
  return{a,p:K.clamp(l/170,0,1)};
}
function haut(){
  const v=visee();S.visee=null;if(!v||v.p<.08)return;
  const vit=60+380*v.p,T=.6+.5*v.p;
  S.de={x:LX,y:LY-18,z:30,vx:Math.sin(v.a)*vit,vy:-Math.cos(v.a)*vit,vz:G*T/2-30/T,
        ang:0,rot:K.rnd(8,14)*(Math.random()<.5?-1:1),face:K.ent(1,6),tf:0,rebond:0,etat:'vol'};
  S.bras=.35;K.son('woosh');
}

function resoudre(d){
  let cible=null;
  for(const c of S.cibles){const ex=(d.x-c.x)/c.r,ey=(d.y-c.y)/(c.r*.62);if(ex*ex+ey*ey<=1){cible=c;break;}}
  const hors=d.x<0||d.x>W||d.y<HAUT-20;
  if(cible){
    d.face=cible.f;cible.flash=1;
    const ex=(d.x-cible.x)/cible.r,ey=(d.y-cible.y)/(cible.r*.62);
    if(ex*ex+ey*ey<=.14){const b=2*cible.f;S.mille++;S.score+=b;K.texte(d.x,d.y-34,t(`Dans le mille +${b}`,`Bullseye +${b}`),C.y,18);K.son('bonus');K.eclats(d.x,d.y,[C.y,'#fff'],18);}
    else{K.son('point');K.eclats(d.x,d.y,COUL[cible.f],10,160);}
    K.texte(d.x,d.y-14,String(cible.f),COUL[cible.f],26);
  }else{
    d.face=K.ent(1,3);
    K.texte(K.clamp(d.x,50,W-50),K.clamp(d.y,HAUT+10,BAS)-14,(hors?t('Hors piste','Out')+' : ':t('Dans la neige','In the snow')+' : ')+d.face,C.mu,16);
    K.son('clac');
  }
  d.etat='pose';d.tp=0;
}

function finManche(){
  const m=K.main(S.main);
  S.score+=m.pts;
  if(!S.meilleure||m.pts>S.meilleure.pts)S.meilleure={...m,faces:[...S.main]};
  if(m.id==='yams'){S.yams++;K.son('yams');K.secoue(10);K.eclats(W/2,300,[C.y,C.g,C.p,'#fff'],60,340);}
  else if(['carre','suite','full'].includes(m.id)){K.son('bonus');K.eclats(W/2,300,[C.y,C.g],30,260);}
  else K.son('point');
  S.annonce={txt:m.nom,pts:m.pts,t:0};
  majStats();
  S.pause=1.7;
  S.apres=()=>{
    S.annonce=null;
    if(S.manche>=MANCHES){
      K.fin({score:S.score,titre:['Le yéti rentre au chaud','The yeti heads home'],details:[
        [S.meilleure?`${S.meilleure.nom} ${S.meilleure.pts}`:'·',['Meilleure main','Best hand']],
        [S.yams,['Yams','Yams']],[S.mille,['Dans le mille','Bullseyes']],[`${MANCHES}/${MANCHES}`,['Manches','Rounds']]]});
      return;
    }
    S.manche++;nouvelleManche();majStats();
    K.bulle(t(`Manche ${S.manche}`,`Round ${S.manche}`)+(S.manche===3?t(' : les cibles bougent !',': targets move!'):''),1800);
  };
}

function maj(dt){
  for(const c of S.cibles){
    if(c.vx){c.x+=c.vx*dt;if(c.x<30+c.r||c.x>W-30-c.r){c.vx*=-1;c.x=K.clamp(c.x,30+c.r,W-30-c.r);}}
    c.flash=Math.max(0,c.flash-dt*1.5);
  }
  for(let i=0;i<S.cibles.length;i++)for(let j=i+1;j<S.cibles.length;j++){
    const a=S.cibles[i],b=S.cibles[j],d=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
    if(dy<(a.r+b.r)*.62+26&&d<a.r+b.r+10&&(a.vx||b.vx)){
      const s=Math.sign(a.x-b.x)||1;
      if(a.vx)a.vx=Math.abs(a.vx)*s;if(b.vx)b.vx=-Math.abs(b.vx)*s;
    }
  }
  S.bras=Math.max(0,S.bras-dt);
  if(S.pause>0){S.pause-=dt;if(S.annonce)S.annonce.t+=dt;if(S.pause<=0&&S.apres){const f=S.apres;S.apres=null;f();}return;}
  const d=S.de;if(!d)return;
  if(d.etat==='vol'){
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx+=S.vent*dt;
    d.z+=d.vz*dt;d.vz-=G*dt;d.ang+=d.rot*dt;
    d.tf+=dt;if(d.tf>.07){d.tf=0;d.face=K.ent(1,6);}
    if(d.z<=0&&d.vz<0){
      d.z=0;
      if(d.rebond<1){d.rebond++;d.vz=-d.vz*.22;d.vx*=.45;d.vy*=.45;d.rot*=.5;K.son('clac');K.eclats(d.x,d.y,C.neige,8,90);}
      else d.etat='glisse';
    }
  }else if(d.etat==='glisse'){
    const v=Math.hypot(d.vx,d.vy),nv=Math.max(0,v-900*dt);
    if(nv<6){d.vx=d.vy=0;d.ang=0;resoudre(d);}
    else{d.vx*=nv/v;d.vy*=nv/v;d.x+=d.vx*dt;d.y+=d.vy*dt;d.ang*=.85;}
  }else if(d.etat==='pose'){
    d.tp+=dt;
    if(d.tp>.75){
      // Le dé rejoint la main, en bas
      S.main.push(d.face);S.lancer++;S.de=null;
      if(S.lancer>=PAR_MANCHE)finManche();
      else{nouveauVent();}
    }
  }
}

// ── Dessin ──
const sapins=Array.from({length:9},(_,i)=>({x:i<5?K.rnd(-6,30):K.rnd(W-30,W+6),y:HAUT+20+i%5*84+K.rnd(-10,10),s:K.rnd(24,40)}));
const bosses=Array.from({length:7},()=>({x:K.rnd(40,W-40),y:K.rnd(HAUT+20,BAS),r:K.rnd(30,70)}));
function sapin(c,x,y,s){
  c.fillStyle='#123526';
  for(let i=0;i<3;i++){const w=s*(1-i*.22),yy=y-i*s*.38;c.beginPath();c.moveTo(x,yy-s*.55);c.lineTo(x+w/2,yy);c.lineTo(x-w/2,yy);c.closePath();c.fill();}
  c.fillStyle='rgba(233,238,247,.55)';
  for(let i=0;i<3;i++){const w=s*(1-i*.22),yy=y-i*s*.38;c.beginPath();c.moveTo(x,yy-s*.55);c.lineTo(x+w*.18,yy-s*.36);c.lineTo(x-w*.18,yy-s*.36);c.closePath();c.fill();}
}
function yeti(c,x,y,lance){
  const bras=lance>0?-1.9+lance*2:-.4;
  c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,40,38,9,0,0,7);c.fill();
  c.fillStyle='#f4f6fb';
  c.save();c.translate(28,-2);c.rotate(S&&S.visee?.6:bras);c.beginPath();c.ellipse(0,16,10,20,0,0,7);c.fill();c.restore();
  c.save();c.translate(-28,-2);c.rotate(.5);c.beginPath();c.ellipse(0,16,10,20,0,0,7);c.fill();c.restore();
  c.beginPath();c.ellipse(0,8,32,36,0,0,7);c.fill();
  c.beginPath();c.arc(0,-26,24,0,7);c.fill();
  // touffes de poils
  c.strokeStyle='rgba(160,175,205,.55)';c.lineWidth=2;
  for(const[a,b]of[[-16,-46],[-4,-50],[9,-48]]){c.beginPath();c.moveTo(a,b+6);c.quadraticCurveTo(a+2,b,a+6,b+3);c.stroke();}
  c.fillStyle='#9fc3ee';c.beginPath();c.ellipse(0,-22,15,12,0,0,7);c.fill();
  c.fillStyle='#1c1a24';c.beginPath();c.arc(-6,-25,2.6,0,7);c.arc(6,-25,2.6,0,7);c.fill();
  c.strokeStyle='#1c1a24';c.lineWidth=2;c.beginPath();c.arc(0,-18,5,.2,Math.PI-.2);c.stroke();
  c.fillStyle='#f0a0b4';c.globalAlpha=.6;c.beginPath();c.arc(-11,-18,3,0,7);c.arc(11,-18,3,0,7);c.fill();c.globalAlpha=1;
  // bonnet rouge, clin d'œil à l'accueil de Mon Yams
  c.fillStyle=C.r;c.beginPath();c.moveTo(-20,-38);c.quadraticCurveTo(0,-64,22,-40);c.quadraticCurveTo(30,-50,34,-36);c.lineTo(20,-36);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,-38,22,5,0,0,7);c.fill();c.beginPath();c.arc(35,-35,4.5,0,7);c.fill();
  c.restore();
}
function tailleDe(y,z){return K.lerp(19,33,K.clamp((y-HAUT)/(LY-HAUT),0,1))+z*.035;}

function dessiner(c,dt){
  // ciel et champ de neige
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d16');g.addColorStop(.12,'#10131f');g.addColorStop(1,'#1a1f30');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(233,238,247,.05)';for(const b of bosses){c.beginPath();c.ellipse(b.x,b.y,b.r,b.r*.35,0,0,7);c.fill();}
  c.fillStyle='rgba(233,238,247,.08)';c.fillRect(0,HAUT-2,W,2);
  K.neige(c,W,H,dt,36);
  for(const s of sapins)sapin(c,s.x,s.y,s.s);
  if(!S){yeti(c,LX,LY+10,0);return;}
  // cibles
  for(const k of S.cibles){
    const co=COUL[k.f];
    c.save();c.translate(k.x,k.y);c.scale(1,.62);
    c.fillStyle=co+'22';c.beginPath();c.arc(0,0,k.r,0,7);c.fill();
    c.lineWidth=2.5;c.strokeStyle=co;c.globalAlpha=.85+k.flash*.15;c.beginPath();c.arc(0,0,k.r,0,7);c.stroke();
    c.globalAlpha=.6;c.lineWidth=1.5;c.beginPath();c.arc(0,0,k.r*.37,0,7);c.stroke();
    if(k.flash>0){c.globalAlpha=k.flash;c.lineWidth=6;c.beginPath();c.arc(0,0,k.r+8*(1-k.flash),0,7);c.stroke();}
    c.restore();c.globalAlpha=1;
    K.de(c,k.x,k.y-k.r*.62-12,15,k.f,{ombre:false,bord:co});
  }
  // vent
  const vf=Math.abs(S.vent),cran=vf<8?0:vf<30?1:vf<55?2:3;
  c.font=K.police(14,700);c.textAlign='left';c.textBaseline='middle';c.fillStyle=C.mu;
  c.fillText(t('Vent','Wind'),14,22);
  c.save();c.translate(76,22);c.strokeStyle=cran?C.b:C.mu;c.lineWidth=2.5;c.lineCap='round';
  if(cran){const s=Math.sign(S.vent);for(let i=0;i<cran;i++){const x=(i*12-cran*6+6)*s;c.beginPath();c.moveTo(x-5*s,-6);c.lineTo(x+3*s,0);c.lineTo(x-5*s,6);c.stroke();}}
  else{c.fillStyle=C.mu;c.fillText(t('nul','calm'),-12,0);}
  c.restore();
  c.textAlign='right';c.fillStyle=C.mu;c.fillText(t('Lancer','Throw')+` ${Math.min(S.lancer+1,PAR_MANCHE)}/${PAR_MANCHE}`,W-14,22);
  c.fillStyle='rgba(233,238,247,.4)';c.font=K.police(13,600);c.textAlign='center';
  c.fillText(t('plus loin = plus fort','farther = higher'),W/2,44);
  // visée
  const v=visee();
  if(v){
    c.save();c.translate(LX,LY-18);c.rotate(v.a);
    c.strokeStyle=`rgba(245,200,66,${.4+.5*v.p})`;c.lineWidth=3;c.setLineDash([6,8]);c.beginPath();c.moveTo(0,0);c.lineTo(0,-(50+110*v.p));c.stroke();c.setLineDash([]);
    c.restore();
    c.strokeStyle='rgba(236,234,246,.12)';c.lineWidth=6;c.beginPath();c.arc(LX,LY+10,52,Math.PI*.15,Math.PI*.85);c.stroke();
    c.strokeStyle=v.p>.85?C.r:C.y;c.beginPath();c.arc(LX,LY+10,52,Math.PI*.85-Math.PI*.7*v.p,Math.PI*.85);c.stroke();
  }
  yeti(c,LX,LY+10,S.bras);
  // dé en vol
  const d=S.de;
  if(d){
    const s=tailleDe(d.y,d.z);
    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(d.x,d.y+s*.3,s*.55*Math.max(.4,1-d.z/400),s*.2,0,0,7);c.fill();
    K.de(c,d.x,d.y-d.z*.55,s,d.face,{angle:d.ang,ombre:false,eclat:d.etat==='pose'?C.y:null});
  }else if(S.pause<=0&&S.manche<=MANCHES){
    K.de(c,LX+30,LY-6+(S.visee?-14:0),18,S.lancer%6+1,{ombre:false});
  }
  // la main en cours
  const y0=H-36,sz=34,gap=8,x0=W/2-(PAR_MANCHE*sz+(PAR_MANCHE-1)*gap)/2+sz/2;
  c.fillStyle='rgba(17,17,23,.85)';K.rr(c,x0-sz/2-10,y0-sz/2-8,PAR_MANCHE*sz+(PAR_MANCHE-1)*gap+20,sz+16,14);c.fill();
  for(let i=0;i<PAR_MANCHE;i++){
    const x=x0+i*(sz+gap);
    if(i<S.main.length)K.de(c,x,y0,sz,S.main[i]);
    else{c.strokeStyle='rgba(236,234,246,.14)';c.lineWidth=1.5;c.setLineDash([4,4]);K.rr(c,x-sz/2,y0-sz/2,sz,sz,7);c.stroke();c.setLineDash([]);}
  }
  if(S.main.length>=2&&!S.annonce){
    const m=K.main(S.main);
    if(m.id!=='rien'){c.font=K.police(12,700);c.textAlign='center';c.fillStyle=C.g;c.fillText(m.nom,W/2,y0-sz/2-24);}
  }
  // annonce de fin de manche
  if(S.annonce){
    const a=S.annonce,k=Math.min(1,a.t*5);
    c.save();c.globalAlpha=k;c.fillStyle='rgba(9,9,13,.7)';K.rr(c,W/2-130,250,260,96,18);c.fill();
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle=a.txt==='Yams'?C.y:C.tx;c.font=K.police(30,800);c.fillText(a.txt,W/2,284);
    c.fillStyle=C.y;c.font=K.police(24,800);c.fillText('+'+a.pts,W/2,318);
    c.restore();
  }
}

K.jeu({id:'04-lancer-du-yeti',case:4,W,H,
  titre:['Lancer du yéti','Yeti Toss'],
  accroche:['Le yéti s\'entraîne pour les jeux d\'hiver. Il lance des dés.','The yeti is training for the winter games. With dice.'],
  regles:[
    ['Tire vers le bas puis lâche, comme une fronde. Plus tu tires, plus il lance loin.','Pull down and let go, like a slingshot. The further you pull, the further it flies.'],
    ['Le dé prend la face de la cible où il s\'arrête. Plus loin, plus fort : la cible 6 est la plus lointaine et la plus petite.','The die takes the face of the target it stops on. Farther means higher: target 6 is the farthest and smallest.'],
    ['Hors cible, le dé tombe dans la neige sur un 1, un 2 ou un 3.','Off target, the die lands in the snow on a 1, 2 or 3.'],
    ['Cinq lancers font une main, comptée comme au Yams (sans figure, la somme des dés) : un Yams de 6 vaut 80. Quatre manches.','Five throws make a hand, scored like in Yams (no combo: the sum of the dice). A Yams of 6 is worth 80. Four rounds.'],
    ['Au centre d\'une cible : deux fois sa face en bonus. Attention au vent, et aux cibles qui bougent dès la 3e manche.','Dead centre: twice its face as a bonus. Mind the wind, and targets that move from round 3.']],
  bouton:['Lancer !','Throw!'],
  stats:[['score',['Score','Score'],0],['manche',['Manche','Round'],'1/4']],
  demarrer,maj,dessiner,bas,glisse,haut,
});
window.__yeti=()=>S;
})();

</script>
</body>
</html>
