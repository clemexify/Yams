<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coup franc | Mon Yams</title>
<link rel="stylesheet" href="shared/kit.css?v=2">
</head>
<body>
<script src="shared/pont.js?v=3"></script>
<script src="shared/kit.js?v=3"></script>
<script>
// Coup franc : dix tirs face à un mur de bonshommes de neige et un lutin gardien.
// Le but est découpé en six zones numérotées de 1 à 6 (les lucarnes valent le plus). On tire
// d'un glisser : le doigt se lève là où l'on vise, un geste courbé brosse le ballon pour
// contourner le mur. Un but vaut sa zone ×10 ; cinq buts forment une main, comptée deux fois
// au barème de Mon Yams.
(()=>{
const K=Kit,C=K.C,t=K.t;
const W=400,H=660,GX0=70,GX1=330,GY=210,GH=120,BY=600,TIRS=15;
// zones du but : en haut 6 | 2 | 5, en bas 4 | 1 | 3
const ZONES=[[6,2,5],[4,1,3]];
let S;
const sc=z=>1+1.4*(1-z);                 // échelle de profondeur
const sol=z=>K.lerp(BY,GY,z);             // ordonnée du sol à la profondeur z
const ecranX=(x,z)=>W/2+(x-W/2)*sc(z);
const ecranY=(h,z)=>sol(z)-h*GH*sc(z);
const ZW=.55;                              // profondeur du mur

function demarrer(){
  S={tir:0,buts:0,score:0,main:[],ballon:null,geste:null,annonce:null,meilleure:null,lucarnes:0,res:null};
  placer();majStats();
}
function majStats(){K.stat('score',S.score);K.stat('tirs',`${Math.min(S.tir+1,TIRS)}/${TIRS}`);}
function placer(){
  const n=S.tir;
  S.mur={x:K.clamp(W/2+K.rnd(-70,70),GX0+40,GX1-40),l:46+Math.min(3,Math.floor(n/3))*8};
  S.gardien={x:W/2,v:0,plonge:0,dir:0};
  S.ballon=null;S.res=null;
}

// ── Le geste ──
function bas(x,y){if(S.ballon||S.res)return;S.geste={pts:[[x,y,performance.now()]]};}
function glisse(x,y){if(S.geste)S.geste.pts.push([x,y,performance.now()]);}
function haut(x,y){
  const g=S.geste;S.geste=null;if(!g||S.ballon||S.res)return;
  g.pts.push([x,y,performance.now()]);
  const[x0,y0,t0]=g.pts[0],[x1,y1,t1]=g.pts[g.pts.length-1];
  const l=Math.hypot(x1-x0,y1-y0);if(l<40||y1>y0-30){K.bulle(t('Glisse du ballon vers le but','Swipe from the ball to the goal'),1400);return;}
  const v=l/Math.max(.05,(t1-t0)/1000);
  // courbure : écart maximal du geste à la ligne droite, signé
  let dev=0;for(const[px,py]of g.pts){const d=((x1-x0)*(y0-py)-(x0-px)*(y1-y0))/l;if(Math.abs(d)>Math.abs(dev))dev=d;}
  let tx=x1,ty=y1;
  if(v>2400){tx+=K.rnd(-1,1)*(v-2400)*.02;ty+=K.rnd(-1,1)*(v-2400)*.015;}
  const mou=v<450;
  tirer(tx,ty,K.clamp(-dev*1.3,-110,110),mou,v);
}
function tirer(tx,ty,courbe,mou,v){
  const hT=(GY-ty)/GH;
  S.ballon={tx,hT,courbe,mou,t:0,T:K.clamp(.95-v/5000,.55,.85),f:K.ent(1,6),ang:0,fini:false,bloque:false};
  K.son('woosh');K.bip(180,.08,'square',.06);
  const gd=S.gardien;gd.reflexe=Math.max(.3,.4-S.tir*.01);gd.cible=K.clamp(tx+K.rnd(-25,25),GX0+10,GX1-10);
}
function position(b,t){
  const x=K.lerp(W/2,b.tx,t)+b.courbe*Math.sin(Math.PI*t);
  const h=(b.mou?b.hT*.4:b.hT)*t+.12*Math.sin(Math.PI*t)*(b.mou?.4:1);
  return[x,Math.max(0,h)];
}
function zone(x,h){
  if(x<GX0||x>GX1||h>1||h<0)return 0;
  const c=Math.min(2,Math.floor((x-GX0)/((GX1-GX0)/3))),r=h>.5?0:1;
  return ZONES[r][c];
}
function resultat(type,f){
  S.res={type,f,t:0};
  if(type==='but'){
    S.buts++;const pts=f*10;S.score+=pts;S.main.push(f);if(f===6||f===5)S.lucarnes++;
    K.son('bonus');K.eclats(ecranX(S.ballon.tx,1),ecranY(position(S.ballon,1)[1],1),[C.g,C.y,'#fff'],40,280);
    K.texte(W/2,150,t(`But ! +${pts}`,`Goal! +${pts}`),C.g,26);
    if(S.main.length>=5){
      const m=K.main(S.main),p=m.pts*2;S.score+=p;if(!S.meilleure||m.pts>S.meilleure.pts)S.meilleure=m;
      S.annonce={txt:m.nom,pts:p,t:0,faces:[...S.main]};S.main=[];K.son(m.id==='yams'?'yams':'bonus');
    }
  }else{
    K.son(type==='arret'?'clac':'aie');
    K.texte(W/2,150,{arret:t('Arrêt du lutin','Saved by the elf'),mur:t('Dans le mur','Into the wall'),dehors:t('À côté','Wide'),court:t('Trop mou','Too soft')}[type],C.r,22);
  }
  majStats();
}

function maj(dt){
  if(S.annonce){S.annonce.t+=dt;if(S.annonce.t>1.8)S.annonce=null;}
  const gd=S.gardien;
  if(S.res){S.res.t+=dt;if(S.res.t>1.4){S.tir++;if(S.tir>=TIRS){fin();return;}placer();majStats();}}
  // le gardien
  if(S.ballon&&!S.ballon.fini){
    gd.reflexe-=dt;
    if(gd.reflexe<=0){const vg=130+S.tir*6,d=gd.cible-gd.x;gd.x+=K.clamp(d,-vg*dt,vg*dt);gd.dir=Math.sign(d);if(Math.abs(d)>30)gd.plonge=Math.min(1,gd.plonge+dt*4);}
  }else if(!S.res){gd.x+=Math.sin(K.temps*2.2)*30*dt;}
  const b=S.ballon;if(!b||b.fini)return;
  const t0=b.t;b.t+=dt/b.T;b.ang+=dt*10;
  if(t0<ZW&&b.t>=ZW){
    const[x,h]=position(b,ZW);
    if(Math.abs(x-S.mur.x)<S.mur.l&&h<.55){b.fini=true;b.bloque=true;b.t=ZW;K.secoue(6);resultat('mur');return;}
  }
  if(b.t>=1){
    b.t=1;b.fini=true;
    const[x,h]=position(b,1);
    if(b.mou){resultat('court');return;}
    const f=zone(x,h);
    if(!f){resultat('dehors');return;}
    // la portée baisse près de la barre : les lucarnes restent jouables sans être garanties
    const portee=(22+gd.plonge*18*(1-h*.35))*(h>.85?.7:1);
    if(Math.abs(x-gd.x)<portee){resultat('arret');return;}
    resultat('but',f);
  }
}
function fin(){
  K.fin({score:S.score,titre:['Fin de la séance','Practice over'],details:[
    [`${S.buts}/${TIRS}`,['Buts','Goals']],[S.lucarnes,['Lucarnes (5 et 6)','Top corners (5 and 6)']],
    [S.meilleure?`${S.meilleure.nom} ${S.meilleure.pts*2}`:'·',['Meilleure main','Best hand']],[S.main.length+'/5',['Main en cours','Hand in progress']]]});
}

function bonhomme(c,x,yb,s){
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x,yb,s*.5,s*.12,0,0,7);c.fill();
  c.fillStyle='#eef2fa';c.beginPath();c.arc(x,yb-s*.42,s*.44,0,7);c.fill();c.beginPath();c.arc(x,yb-s*1.05,s*.3,0,7);c.fill();
  c.fillStyle='#1c1a24';c.beginPath();c.arc(x-s*.1,yb-s*1.1,s*.04,0,7);c.arc(x+s*.1,yb-s*1.1,s*.04,0,7);c.fill();
  c.fillStyle='#ff8a3a';c.beginPath();c.moveTo(x,yb-s*1.03);c.lineTo(x+s*.2,yb-s*.99);c.lineTo(x,yb-s*.96);c.fill();
  c.fillStyle=C.r;c.fillRect(x-s*.3,yb-s*.82,s*.6,s*.1);
}
function dessiner(c,dt){
  // ciel et terrain
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d16');g.addColorStop(.28,'#121828');g.addColorStop(.3,'#123224');g.addColorStop(1,'#0d2219');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  K.neige(c,W,GY,dt,22);
  c.strokeStyle='rgba(233,238,247,.18)';c.lineWidth=2;
  c.beginPath();c.moveTo(ecranX(GX0-60,1),sol(1));c.lineTo(ecranX(GX0-60,0),sol(0));c.moveTo(ecranX(GX1+60,1),sol(1));c.lineTo(ecranX(GX1+60,0),sol(0));
  c.moveTo(0,sol(1));c.lineTo(W,sol(1));c.stroke();
  c.beginPath();c.ellipse(W/2,sol(.82),70,16,0,Math.PI,0);c.stroke();
  // but : filet et zones
  c.fillStyle='rgba(233,238,247,.04)';c.fillRect(GX0,GY-GH,GX1-GX0,GH);
  c.strokeStyle='rgba(233,238,247,.08)';c.lineWidth=1;
  for(let x=GX0;x<=GX1;x+=13){c.beginPath();c.moveTo(x,GY-GH);c.lineTo(x,GY);c.stroke();}
  for(let y=GY-GH;y<=GY;y+=13){c.beginPath();c.moveTo(GX0,y);c.lineTo(GX1,y);c.stroke();}
  const zw=(GX1-GX0)/3;
  for(let r=0;r<2;r++)for(let k=0;k<3;k++){const f=ZONES[r][k];
    K.de(c,GX0+zw*k+zw/2,GY-GH+GH/4+r*GH/2,f>=5?24:20,f,{alpha:f>=5?.6:.45,ombre:false,eclat:f>=5?'rgba(245,200,66,.5)':null});}
  c.strokeStyle='rgba(233,238,247,.1)';c.setLineDash([4,5]);c.beginPath();c.moveTo(GX0,GY-GH/2);c.lineTo(GX1,GY-GH/2);
  c.moveTo(GX0+zw,GY-GH);c.lineTo(GX0+zw,GY);c.moveTo(GX0+2*zw,GY-GH);c.lineTo(GX0+2*zw,GY);c.stroke();c.setLineDash([]);
  c.strokeStyle='#f4f6fb';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(GX0,GY);c.lineTo(GX0,GY-GH);c.lineTo(GX1,GY-GH);c.lineTo(GX1,GY);c.stroke();
  if(!S){return;}
  // gardien lutin
  const gd=S.gardien,gx=gd.x,inc=gd.plonge*gd.dir*.9,bh=S.ballon?position(S.ballon,S.ballon.t)[1]:0,leve=bh>.6?22:0;
  c.save();c.translate(gx,GY);c.rotate(inc);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,0,22,5,0,0,7);c.fill();
  c.fillStyle='#1d6b45';K.rr(c,-14,-58,28,46,10);c.fill();
  c.fillStyle='#f3d6c0';c.beginPath();c.arc(0,-66,11,0,7);c.fill();
  c.fillStyle=C.r;c.beginPath();c.moveTo(-11,-72);c.quadraticCurveTo(4,-96,18,-84);c.lineTo(10,-70);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(19,-84,3.5,0,7);c.fill();
  c.strokeStyle='#1d6b45';c.lineWidth=7;c.beginPath();c.moveTo(-12,-50);c.lineTo(-26-gd.plonge*10,-70-leve);c.moveTo(12,-50);c.lineTo(26+gd.plonge*10,-70-leve);c.stroke();
  c.fillStyle='#f4f6fb';c.beginPath();c.arc(-27-gd.plonge*10,-72-leve,5,0,7);c.arc(27+gd.plonge*10,-72-leve,5,0,7);c.fill();
  c.restore();
  // ballon derrière le mur ?
  const b=S.ballon;
  const dessinBallon=()=>{
    const tb=b?b.t:0,[x,h]=b?position(b,tb):[W/2,0];
    const sx=ecranX(x,tb),sy=ecranY(h,tb),s=K.lerp(34,14,tb);
    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(sx,sol(tb),s*.5,s*.15,0,0,7);c.fill();
    K.de(c,sx,sy-s/2,s,b?b.f:6,{angle:b?b.ang:0,ombre:false});
  };
  if(b&&b.t>ZW&&!b.bloque)dessinBallon();
  // le mur
  const ms=sc(ZW),n=3,lw=S.mur.l;
  for(let i=0;i<n;i++){const x=S.mur.x-lw+lw*2*(i+.5)/n;bonhomme(c,ecranX(x,ZW),sol(ZW),46*ms);}
  if(!b||b.t<=ZW||b.bloque)dessinBallon();
  // geste
  if(S.geste&&S.geste.pts.length>1){
    c.strokeStyle='rgba(245,200,66,.7)';c.lineWidth=4;c.lineCap='round';c.lineJoin='round';c.beginPath();
    S.geste.pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
  }
  // bandeau du bas : main
  const sz=26,gp=7,x0=W/2-(5*sz+4*gp)/2+sz/2,y0=H-28;
  for(let i=0;i<5;i++){const x=x0+i*(sz+gp);
    if(i<S.main.length)K.de(c,x,y0,sz,S.main[i],{ombre:false});
    else{c.strokeStyle='rgba(236,234,246,.15)';c.lineWidth=1.5;c.setLineDash([4,4]);K.rr(c,x-sz/2,y0-sz/2,sz,sz,6);c.stroke();c.setLineDash([]);}}
  if(!b&&!S.res&&S.tir===0){c.font=K.police(13,600);c.textAlign='center';c.fillStyle=C.mu;c.fillText(t('Glisse du ballon vers le but','Swipe from the ball to the goal'),W/2,BY-56);}
  if(S.annonce){
    const a=S.annonce,k=Math.min(1,a.t*5);
    c.save();c.globalAlpha=k*(a.t>1.5?Math.max(0,1-(a.t-1.5)/.3):1);c.fillStyle='rgba(9,9,13,.88)';K.rr(c,W/2-120,250,240,110,18);c.fill();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle=a.txt==='Yams'?C.y:C.tx;c.font=K.police(24,800);c.fillText(a.txt,W/2,276);
    c.fillStyle=C.y;c.font=K.police(20,800);c.fillText('+'+a.pts,W/2,304);
    a.faces.forEach((f,i)=>K.de(c,W/2-60+i*30,336,24,f,{ombre:false}));c.restore();
  }
}

K.jeu({id:'13-coup-franc',case:13,W,H,
  titre:['Coup franc','Free Kick'],
  accroche:['Quinze coups francs, un mur de bonshommes de neige et un lutin dans les buts.','Fifteen free kicks, a wall of snowmen and an elf in goal.'],
  regles:[
    ['Glisse du ballon vers le but et lève le doigt là où tu vises. Un geste rapide et franc : trop mou, le ballon n\'arrive pas.','Swipe from the ball towards the goal and lift your finger where you aim. Quick and firm: too soft and the ball falls short.'],
    ['Courbe ton geste pour brosser le ballon autour du mur, ou vise haut pour passer par-dessus.','Curve your swipe to bend the ball around the wall, or aim high to go over it.'],
    ['Le but a six zones de 1 à 6, les lucarnes valent 5 et 6. Un but vaut sa zone ×10.','The goal has six zones from 1 to 6; the top corners are worth 5 and 6. A goal is worth its zone ×10.'],
    ['Tes buts forment une main : au cinquième, elle rapporte deux fois ses points du Yams.','Your goals make a hand: on the fifth, it scores twice its Yams points.']],
  bouton:['Tirer','Shoot'],
  stats:[['score',['Score','Score'],0],['tirs',['Tir','Shot'],'1/10']],
  demarrer,maj,dessiner,bas,glisse,haut,
});
window.__franc=()=>S;
window.__tirer=(tx,ty,courbe,v)=>tirer(tx,ty,courbe||0,(v||1200)<450,v||1200);
})();
</script>
</body>
</html>
